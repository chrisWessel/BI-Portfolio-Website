<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Airline review analytics SQL example</title>
  <desc id="desc">A code-editor-style view of an aggregate SQL query for airline and travel-class ratings, without reviewer names or free-text reviews.</desc>
  <rect width="1600" height="900" fill="#111820"/>
  <rect width="1600" height="64" fill="#202a33"/>
  <circle cx="31" cy="32" r="8" fill="#f36f65"/>
  <circle cx="59" cy="32" r="8" fill="#e8bb58"/>
  <circle cx="87" cy="32" r="8" fill="#65b77b"/>
  <text x="126" y="39" fill="#dbe3e8" font-family="Segoe UI, Arial, sans-serif" font-size="19">airline-reviews.sql</text>
  <text x="1510" y="38" text-anchor="end" fill="#82919c" font-family="Segoe UI, Arial, sans-serif" font-size="15">T-SQL</text>
  <rect x="0" y="64" width="78" height="836" fill="#182129"/>
  <g fill="#73818d" font-family="Consolas, monospace" font-size="17" text-anchor="middle">
    <text x="39" y="116">1</text><text x="39" y="157">2</text><text x="39" y="198">3</text><text x="39" y="239">4</text><text x="39" y="280">5</text><text x="39" y="321">6</text><text x="39" y="362">7</text><text x="39" y="403">8</text><text x="39" y="444">9</text><text x="39" y="485">10</text><text x="39" y="526">11</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="21">
    <text x="112" y="116"><tspan fill="#c586c0">SELECT</tspan></text>
    <text x="112" y="157"><tspan fill="#9cdcfe">    Airline</tspan><tspan fill="#d4d4d4">,</tspan></text>
    <text x="112" y="198"><tspan fill="#d4d4d4">    TravelClass,</tspan></text>
    <text x="112" y="239"><tspan fill="#d4d4d4">    COUNT_BIG(*) </tspan><tspan fill="#c586c0">AS</tspan><tspan fill="#9cdcfe"> ReviewCount</tspan><tspan fill="#d4d4d4">,</tspan></text>
    <text x="112" y="280"><tspan fill="#d4d4d4">    AVG(OverallRating) </tspan><tspan fill="#c586c0">AS</tspan><tspan fill="#9cdcfe"> AverageRating</tspan><tspan fill="#d4d4d4">,</tspan></text>
    <text x="112" y="321"><tspan fill="#d4d4d4">    AVG(CONVERT(decimal(5, 2), IsRecommended))</tspan></text>
    <text x="112" y="362"><tspan fill="#c586c0">        AS</tspan><tspan fill="#9cdcfe"> RecommendationShare</tspan></text>
    <text x="112" y="403"><tspan fill="#c586c0">FROM</tspan><tspan fill="#9cdcfe"> mart.vw_AirlineReview</tspan></text>
    <text x="112" y="444"><tspan fill="#c586c0">WHERE</tspan><tspan fill="#9cdcfe"> Airline </tspan><tspan fill="#c586c0">IS NOT NULL</tspan></text>
    <text x="112" y="485"><tspan fill="#c586c0">GROUP BY</tspan><tspan fill="#9cdcfe"> Airline, TravelClass</tspan></text>
    <text x="112" y="526"><tspan fill="#c586c0">ORDER BY</tspan><tspan fill="#9cdcfe"> Airline, RecommendationShare </tspan><tspan fill="#c586c0">DESC</tspan><tspan fill="#d4d4d4">;</tspan></text>
  </g>
  <rect x="78" y="814" width="1522" height="86" fill="#172129"/>
  <circle cx="111" cy="856" r="7" fill="#74c991"/>
  <text x="134" y="862" fill="#b8c5cd" font-family="Segoe UI, Arial, sans-serif" font-size="16">Aggregated ratings and recommendation share · reviewer identifiers and written reviews excluded</text>
</svg>
