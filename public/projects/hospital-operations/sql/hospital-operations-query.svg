<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hospital operations SQL example</title>
  <desc id="desc">A code-editor-style view of a T-SQL query summarizing visit count, clinical cost and satisfaction by service type.</desc>
  <rect width="1600" height="900" fill="#111820"/>
  <rect width="1600" height="64" fill="#202a33"/>
  <circle cx="31" cy="32" r="8" fill="#f36f65"/>
  <circle cx="59" cy="32" r="8" fill="#e8bb58"/>
  <circle cx="87" cy="32" r="8" fill="#65b77b"/>
  <text x="126" y="39" fill="#dbe3e8" font-family="Segoe UI, Arial, sans-serif" font-size="19">hospital-operations.sql</text>
  <text x="1510" y="38" text-anchor="end" fill="#82919c" font-family="Segoe UI, Arial, sans-serif" font-size="15">T-SQL</text>
  <rect x="0" y="64" width="78" height="836" fill="#182129"/>
  <g fill="#73818d" font-family="Consolas, monospace" font-size="17" text-anchor="middle">
    <text x="39" y="112">1</text><text x="39" y="153">2</text><text x="39" y="194">3</text><text x="39" y="235">4</text><text x="39" y="276">5</text><text x="39" y="317">6</text><text x="39" y="358">7</text><text x="39" y="399">8</text><text x="39" y="440">9</text><text x="39" y="481">10</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="21">
    <text x="112" y="116"><tspan fill="#c586c0">SELECT</tspan></text>
    <text x="112" y="157"><tspan fill="#9cdcfe">    ServiceType</tspan><tspan fill="#d4d4d4">,</tspan></text>
    <text x="112" y="198"><tspan fill="#d4d4d4">    COUNT_BIG(*) </tspan><tspan fill="#c586c0">AS</tspan><tspan fill="#9cdcfe"> VisitCount</tspan><tspan fill="#d4d4d4">,</tspan></text>
    <text x="112" y="239"><tspan fill="#d4d4d4">    SUM(COALESCE(TreatmentCost, 0)</tspan></text>
    <text x="112" y="280"><tspan fill="#d4d4d4">        + COALESCE(MedicationCost, 0)) </tspan><tspan fill="#c586c0">AS</tspan></text>
    <text x="112" y="321"><tspan fill="#9cdcfe">        ClinicalCost</tspan><tspan fill="#d4d4d4">,</tspan></text>
    <text x="112" y="362"><tspan fill="#d4d4d4">    AVG(CONVERT(decimal(12, 2),</tspan></text>
    <text x="112" y="403"><tspan fill="#d4d4d4">        PatientSatisfactionScore)) </tspan><tspan fill="#c586c0">AS</tspan></text>
    <text x="112" y="444"><tspan fill="#9cdcfe">        AverageSatisfaction</tspan></text>
    <text x="112" y="485"><tspan fill="#c586c0">FROM</tspan><tspan fill="#9cdcfe"> mart.vw_HospitalVisits</tspan></text>
    <text x="112" y="526"><tspan fill="#c586c0">GROUP BY</tspan><tspan fill="#9cdcfe"> ServiceType</tspan></text>
    <text x="112" y="567"><tspan fill="#c586c0">ORDER BY</tspan><tspan fill="#9cdcfe"> VisitCount </tspan><tspan fill="#c586c0">DESC</tspan><tspan fill="#d4d4d4">;</tspan></text>
  </g>
  <rect x="78" y="814" width="1522" height="86" fill="#172129"/>
  <circle cx="111" cy="856" r="7" fill="#74c991"/>
  <text x="134" y="862" fill="#b8c5cd" font-family="Segoe UI, Arial, sans-serif" font-size="16">Operational summary · visit volume, clinical cost and patient satisfaction by service type</text>
</svg>
